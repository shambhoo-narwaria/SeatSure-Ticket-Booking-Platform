spring:
  application:
    name: seatsure-backend
  profiles:
    active: local

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seatsure}
    username: ${DATABASE_USERNAME:seatsure_app}
    password: ${DATABASE_PASSWORD:seatsure_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

seatsure:
  booking:
    hold-duration-seconds: ${HOLD_DURATION_SECONDS:300}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  file:
    name: ${LOG_FILE:logs/seatsure.log}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
  level:
    com.seatsure: INFO
    org.springframework.web: INFO

