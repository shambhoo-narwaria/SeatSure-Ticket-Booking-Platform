services:
  postgres:
    image: postgres:16-alpine
    container_name: seatsure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seatsure}
      POSTGRES_USER: ${POSTGRES_USER:-seatsure_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatsure_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - seatsure_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seatsure_app} -d ${POSTGRES_DB:-seatsure}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  seatsure_pgdata:
